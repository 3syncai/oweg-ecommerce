<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <title>OWEG</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafbf7;
        color: #1f2a33;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        line-height: 1.45;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <strong>OWEG</strong>
      <p>
        Opening the store. If this screen stays visible, check your network and
        reopen the app.
      </p>
    </div>
  </body>
</html>
